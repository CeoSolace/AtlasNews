<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AtlasRegion7 – Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="form-container">
    <h2>Sign in to AtlasRegion7</h2>
    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" required placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" required placeholder="Enter your password">
      </div>
      <div class="form-group">
        <button type="submit">Login</button>
      </div>
    </form>
    <hr style="margin:1.5rem 0; border-color: var(--color-gray);">
    <h3 style="margin-bottom: 0.5rem; color: var(--color-gold); font-size: 1rem; text-align: center;">Create a New Account</h3>
    <form id="signup-form">
      <div class="form-group">
        <label for="signup-username">Username</label>
        <input type="text" id="signup-username" required placeholder="Choose a username">
      </div>
      <div class="form-group">
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" required placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" required placeholder="Create a password">
      </div>
      <div class="form-group">
        <label for="signup-plan">Plan</label>
        <select id="signup-plan">
          <option value="free">Free (ads & limited comments)</option>
          <option value="paid">Paid (no ads, full comments)</option>
        </select>
      </div>
      <div class="form-group">
        <button type="submit">Create Account</button>
      </div>
    </form>
  </div>
  <!-- Include common utilities for region and session handling -->
  <script src="js/common.js"></script>
  <!-- Login/Signup logic -->
  <script src="js/login.js"></script>
</body>
</html>
