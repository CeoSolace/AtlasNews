<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>AtlasRegion7 – Home</title>
  <meta name="description" content="AtlasRegion7 brings you authoritative gaming news, reviews and esports intelligence from around the world.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <div class="logo-container">
      <img src="assets/logo.png" alt="AtlasRegion7 Logo">
      <span>AtlasRegion7</span>
    </div>
    <div id="header-user" style="cursor:pointer; font-size:0.85rem;"></div>
  </header>
  <div class="region-strip" id="region-strip"></div>
  <div class="container">
    <!-- Top Ad -->
    <div id="ad-top"></div>
    <!-- Hero Section -->
    <div id="hero-section" class="hero"></div>
    <!-- Content and Sidebar -->
    <div class="content-layout">
      <div class="main-content">
        <!-- Top Stories -->
        <div class="section-heading"><h3>Top Stories in Your Region</h3></div>
        <div id="top-stories"></div>
        <!-- Trending Global -->
        <div class="section-heading"><h3>Trending Global</h3></div>
        <div id="trending-global"></div>
        <!-- Latest Reviews -->
        <div class="section-heading"><h3>Latest Reviews</h3></div>
        <div id="latest-reviews"></div>
        <!-- Regional Highlights -->
        <div class="section-heading"><h3>Regional Highlights</h3></div>
        <div id="regional-highlights"></div>
      </div>
      <div class="sidebar">
        <div id="ad-sidebar"></div>
      </div>
    </div>
  </div>
  <footer>
    &copy; 2026 AtlasRegion7. All rights reserved.
  </footer>
  <!-- API client must be loaded before common utilities -->
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
